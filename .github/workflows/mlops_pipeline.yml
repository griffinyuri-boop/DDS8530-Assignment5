name: DDS8530 ETL and MLOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas dask pyarrow scikit-learn sqlalchemy requests flask joblib mlflow

      - name: Run ETL pipeline
        run: python etl_pipeline.py

      - name: Run Dask processing
        run: python dask_processing.py

      - name: Train machine learning model
        run: python train_model.py

      - name: Run MLflow experiment
        run: python mlflow_training.py